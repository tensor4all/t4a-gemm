[package]
name = "t4a-gemm-f32"
version = "0.19.0"
edition = "2021"
authors = ["sarah <>"]
description = "Playground for matrix multiplication algorithms"
readme = "../README.md"
repository = "https://github.com/tensor4all/t4a-gemm"
homepage = "https://github.com/tensor4all/t4a-gemm"
documentation = "https://github.com/tensor4all/t4a-gemm"
license = "MIT"
keywords = ["linear-algebra"]

[lib]
name = "gemm_f32"

[dependencies]
raw-cpuid = { workspace = true }
seq-macro = { workspace = true }
dyn-stack = { workspace = true, default-features = false }
num-traits = { workspace = true, default-features = false }
num-complex = { workspace = true, default-features = false }
paste = { workspace = true }

gemm-common = { package = "t4a-gemm-common", version = "0.19.0", default-features = false, path = "../gemm-common" }

[features]
default = ["std", "rayon"]
std = ["dyn-stack/std", "gemm-common/std"]
x86-v4 = ["gemm-common/x86-v4"]
experimental-apple-amx = ["std", "gemm-common/experimental-apple-amx"]
rayon = ["std", "gemm-common/rayon"]
# only gemm-f64 ships an SME microkernel; declared so the shared `gemm_def!`
# expansion has a known cfg on every crate
sme = []
