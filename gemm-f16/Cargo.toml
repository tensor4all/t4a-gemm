[package]
name = "t4a-gemm-f16"
version = "0.19.0"
edition = "2021"
authors = ["sarah <>"]
description = "Playground for matrix multiplication algorithms"
readme = "../README.md"
repository = "https://github.com/tensor4all/t4a-gemm"
homepage = "https://github.com/tensor4all/t4a-gemm"
documentation = "https://github.com/tensor4all/t4a-gemm"
license = "MIT"
keywords = ["linear-algebra"]

[lib]
name = "gemm_f16"

[dependencies]
raw-cpuid = { workspace = true }
seq-macro = { workspace = true }
dyn-stack = { workspace = true, default-features = false }
num-traits = { workspace = true, default-features = false }
num-complex = { workspace = true, default-features = false }
paste = { workspace = true }
rayon = { workspace =true, optional = true }

gemm-common = { package = "t4a-gemm-common", version = "0.19.0", default-features = false, path = "../gemm-common", features = ["f16"] }
gemm-f32 = { package = "t4a-gemm-f32", version = "0.19.0", default-features = false, path = "../gemm-f32" }
half = { workspace = true, default-features = false }

[features]
default = ["std", "rayon"]
std = ["dyn-stack/std", "gemm-common/std", "gemm-f32/std"]
experimental-apple-amx = ["std", "gemm-common/experimental-apple-amx", "gemm-f32/experimental-apple-amx"]
x86-v4 = ["gemm-common/x86-v4", "gemm-f32/x86-v4"]
rayon = ["dep:rayon", "std", "gemm-common/rayon", "gemm-f32/rayon"]
