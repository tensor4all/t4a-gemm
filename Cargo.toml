[workspace]
members = ["gemm", "gemm-common", "gemm-f16", "gemm-f32", "gemm-f64", "gemm-c32", "gemm-c64"]
resolver = "2"

[workspace.dependencies]
once_cell = { version = "1.18", default-features = false }
seq-macro = "0.3"
paste = "1.0"
raw-cpuid = { version = "11.2", default-features = false }
sysctl = "0.6.0"
dyn-stack = { version = "0.13", default-features = false, features = ["alloc"] }
num-traits = { version = "0.2", default-features = false }
num-complex = { version = "0.4", default-features = false }
rayon = "1"
half = { version = "2.3", default-features = false, features = ["num-traits", "bytemuck"] }

[profile.dev]
opt-level = 3
debug = true
debug-assertions = true
overflow-checks = true
lto = false
panic = 'unwind'
incremental = true
codegen-units = 256
rpath = false

# CI builds and tests with this profile (tensor4all-agent-rules, rules/common/repository.md,
# "Build Profiles"). It inherits `test`, not `release`: `test` inherits `dev` above, which keeps
# `opt-level = 3` and turns `debug-assertions` and `overflow-checks` on deliberately. The
# micro-kernels are raw-pointer code (several hundred `unsafe` sites) whose stride and packing
# invariants are `debug_assert!`s, and the standard library's unsafe-precondition checks only run
# with `debug-assertions`; a release-inherited CI would test none of that. `debug = 0` overrides the
# `debug = true` of `dev`, which is the debug info this profile exists to drop.
[profile.ci]
inherits = "test"
debug = 0
incremental = false
strip = "symbols"
