[package]
name = "t4a-gemm-common"
version = "0.20.4"
edition = "2021"
authors = ["sarah <>"]
description = "Playground for matrix multiplication algorithms -- tensor4all fork: adds an Apple Silicon SME (aarch64 + macOS 26) path, everything else is upstream code"
readme = "../README.md"
repository = "https://github.com/tensor4all/t4a-gemm"
homepage = "https://github.com/tensor4all/t4a-gemm"
documentation = "https://github.com/tensor4all/t4a-gemm"
license = "MIT"
keywords = ["linear-algebra"]

[lib]
name = "gemm_common"

[dependencies]
raw-cpuid = { workspace = true }
seq-macro = { workspace = true }
once_cell = { workspace = true, default-features = false, features = ["race", "alloc"] }
dyn-stack = { workspace = true, default-features = false }
num-traits = { workspace = true, default-features = false }
num-complex = { workspace = true, default-features = false }
half = { workspace = true, default-features = false, optional=true }
rayon = { workspace = true, optional = true }
paste = { workspace = true }
pulp = { version = "0.22.0", default-features = false }
bytemuck = "1.14"
libm = "0.2.11"

[target.'cfg(target_vendor = "apple")'.dependencies]
sysctl = { workspace = true, optional = true }

[features]
default = [
  "std",
  "rayon",
  "f16",
]
std = ["pulp/std", "dyn-stack/std", "once_cell/std", "sysctl"]
x86-v4 = ["pulp/x86-v4"]
wasm-simd128-enable = []
experimental-apple-amx = ["std"]
rayon = ["dep:rayon", "std"]
f16 = ["half"]
# Enables `cache::HasAppleSme`, the runtime probe for the Apple SME kernels.
# Only meaningful on aarch64 + target_vendor = "apple"; the dtype crates forward it.
apple-sme = ["std"]
